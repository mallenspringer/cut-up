name: Build & Deploy Cut Up to Hostinger

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Run Unit Tests
        run: npm test

      - name: 5. Build Production Bundle
        run: npm run build

      - name: 6. Sanitize FTP Connection Parameters
        id: ftp-config
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          # Strip protocol prefixes (ftp://, ftps://, https://, http://) and trailing slashes/paths
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*://||' -e 's|/.*$||' | tr -d '[:space:]')

          RAW_DIR="${{ secrets.FTP_REMOTE_DIR }}"
          CLEAN_DIR="${RAW_DIR%/}/"
          [[ "$CLEAN_DIR" != /* ]] && CLEAN_DIR="/$CLEAN_DIR"

          echo "server=$CLEAN_SERVER" >> "$GITHUB_OUTPUT"
          echo "dir=$CLEAN_DIR" >> "$GITHUB_OUTPUT"

      - name: 7. Sync Dist to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-config.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp-config.outputs.dir }}
          local-dir: ./dist/
